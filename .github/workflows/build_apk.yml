name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          set +e
          flutter build apk --debug --no-tree-shake-icons > build_output.txt 2>&1
          BUILD_EXIT=$?
          cat build_output.txt
          exit $BUILD_EXIT

      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add build_output.txt
          git commit -m "ci: build error log [skip ci]"
          git push

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supready-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
