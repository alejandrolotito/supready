name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Android project scaffold
        run: flutter create --project-name supready --org com.supready --platforms android .

      - name: Apply custom AndroidManifest
        run: cp android_custom/AndroidManifest_custom.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos 2>&1 || true

      - name: Build APK debug
        run: flutter build apk --debug 2>&1 | tee /tmp/build_output.txt; exit ${PIPESTATUS[0]}

      - name: Post errors as commit comment
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/build_output.txt', 'utf8');
            // Extract error lines only
            const errors = log.split('\n')
              .filter(l => l.includes('error:') || l.includes('Error') || l.includes('Exception') || l.includes('.dart:'))
              .slice(0, 50)
              .join('\n');
            const body = `## ❌ Build Failed\n\`\`\`\n${errors || log.slice(-3000)}\n\`\`\``;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

      - name: Upload APK on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supready-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
