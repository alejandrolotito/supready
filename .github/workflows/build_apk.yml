name: Build APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Android project scaffold
        run: flutter create --project-name supready --org com.supready --platforms android .

      - name: Override Android build files
        run: |
          # Apply our custom build.gradle with proper compileSdkVersion
          cp android_custom/app_build.gradle android/app/build.gradle
          cp android_custom/root_build.gradle android/build.gradle
          cp android_custom/gradle_wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          cp android_custom/AndroidManifest_custom.xml android/app/src/main/AndroidManifest.xml

          # Fix MainActivity to use v2 embedding
          MAIN_KT=$(find android -name "MainActivity.kt" | head -1)
          cat > $MAIN_KT << 'KOTLIN'
package com.supready.supready
import io.flutter.embedding.android.FlutterActivity
class MainActivity : FlutterActivity()
KOTLIN
          echo "All android files patched ✅"
          cat android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos 2>&1 || true

      - name: Build APK debug
        run: flutter build apk --debug 2>&1 | tee /tmp/build_output.txt; exit ${PIPESTATUS[0]}

      - name: Write errors to repo on failure
        if: failure()
        run: |
          echo "--- BUILD ERRORS $(date) ---" > BUILD_ERRORS.txt
          tail -100 /tmp/build_output.txt >> BUILD_ERRORS.txt
          git config user.email "ci@supready.app"
          git config user.name "SUPReady CI"
          git add BUILD_ERRORS.txt
          git commit -m "ci: build errors [skip ci]" || true
          git push || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supready-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
