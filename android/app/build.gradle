plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.supready.app"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    signingConfigs {
        release {
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "supready-debug.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "supready2024"
            keyAlias      System.getenv("KEY_ALIAS")         ?: "supready"
            keyPassword   System.getenv("KEY_PASSWORD")      ?: "supready2024"
        }
    }

    defaultConfig {
        applicationId "com.supready.app"
        minSdk 21
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        debug {
            // Usa el mismo signingConfig que release para firma consistente
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
