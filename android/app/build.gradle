plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.supready.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    signingConfigs {
        release {
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "supready-debug.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "supready2024"
            keyAlias      System.getenv("KEY_ALIAS")         ?: "supready"
            keyPassword   System.getenv("KEY_PASSWORD")      ?: "supready2024"
        }
    }

    defaultConfig {
        applicationId "com.supready.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        // versionCode auto-increment con el número de build de CI
        versionCode = (System.getenv("BUILD_NUMBER") ?: "1").toInteger()
        versionName "3.6.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
