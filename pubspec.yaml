name: supready
description: "Plataforma de Navegación, Clima y Seguridad para Stand Up Paddle"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # === ESTADO Y ARQUITECTURA ===
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  get_it: ^7.6.7
  injectable: ^2.3.2

  # === NAVEGACIÓN ===
  go_router: ^13.2.0

  # === RED / API ===
  dio: ^5.4.3
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # === BASE DE DATOS LOCAL (SQLite/Room) ===
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # === GPS Y MAPS ===
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  background_locator_2: ^2.0.6

  # === AUTENTICACIÓN GOOGLE (OAuth 2.0) ===
  google_sign_in: ^6.2.1
  firebase_auth: ^4.17.9
  firebase_core: ^2.27.1

  # === PERMISOS ===
  permission_handler: ^11.3.1

  # === SMS / SOS ===
  telephony: ^0.2.0

  # === UI / DISEÑO ===
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0

  # === VIDEO (Academia SUP) ===
  video_player: ^2.8.3
  chewie: ^1.7.4

  # === UTILIDADES ===
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.3
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  injectable_generator: ^2.4.2
  retrofit_generator: ^8.1.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
