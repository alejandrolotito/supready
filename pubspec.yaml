name: supready
description: "Plataforma de Navegación, Clima y Seguridad para Stand Up Paddle"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navegación
  go_router: ^17.4.0

  # Red / API
  dio: ^5.4.3

  # Base de datos local
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # GPS
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

# Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.8.0
  firebase_database: ^12.4.7
  firebase_messaging: ^16.5.0

  # Permisos
  permission_handler: ^13.0.0

  # SMS SOS
  url_launcher: ^6.2.6

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Fotos (cámara al finalizar remada)
  image_picker: ^1.1.2

  # Compartir ruta
  share_plus: ^13.3.0

  # Gráficos / stats
  fl_chart: ^1.2.0

  # Utilidades
  intl: ^0.20.3
  connectivity_plus: ^7.3.1
  uuid: ^4.3.3
  path_provider: ^2.1.3
  flutter_foreground_task: ^10.0.0
  wakelock_plus: ^1.1.4
  http: ^1.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
