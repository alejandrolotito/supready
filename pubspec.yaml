name: supready
description: "Plataforma de Navegación, Clima y Seguridad para Stand Up Paddle"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navegación
  go_router: ^13.2.0

  # Red
  dio: ^5.4.3

  # Base de datos local
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # GPS
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Auth Google
  google_sign_in: ^6.2.1

  # Permisos
  permission_handler: ^11.3.1

  # SMS SOS via url_launcher
  url_launcher: ^6.2.6

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Video (Academia)
  video_player: ^2.8.3

  # Utilidades
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
